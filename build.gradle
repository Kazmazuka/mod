plugins {
    id 'java'
    id 'net.neoforged.moddev' version '2.0.78'
}

version = '1.0.0'
group = 'com.example.realisticview'

base {
    archivesName = 'realisticview'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    // Minecraft 1.21.1 用 NeoForge。新しい 21.1.x が出ていれば上げてOK
    version = '21.1.172'

    runs {
        client {
            client()
        }
    }

    mods {
        realisticview {
            sourceSet sourceSets.main
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
